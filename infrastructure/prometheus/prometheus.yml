global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'transaction-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['transaction-service:8081']
        labels:
          service: 'transaction-service'
  
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
