syntax = "proto3";

option java_multiple_files = true;
option java_package = "dev.merchantrail.bank.grpc";
option java_outer_classname = "BankAuthorizationProto";

package bank;

// Bank authorization service using simplified ISO 8583 format
service BankAuthorizationService {
  rpc Authorize (AuthorizationRequest) returns (AuthorizationResponse);
}

message AuthorizationRequest {
  string mti = 1; // Message Type Indicator (0100 for auth request)
  string pan = 2; // Primary Account Number (masked)
  int64 amount = 3; // Amount in minor units
  string currency = 4; // Currency code
  string merchant_id = 5;
  string transaction_id = 6;
  string timestamp = 7;
}

message AuthorizationResponse {
  string mti = 1; // Message Type Indicator (0110 for auth response)
  string response_code = 2; // 00=approved, 05=decline, 91=timeout
  string authorization_code = 3; // 6-character approval code
  string transaction_id = 4;
  string timestamp = 5;
}
