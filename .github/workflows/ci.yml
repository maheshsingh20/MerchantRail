name: CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Clear Maven cache completely
      run: |
        rm -rf ~/.m2/repository
        rm -rf ~/.m2/wrapper
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        # Temporarily disable cache to force fresh downloads
    
    - name: Create Maven settings.xml
      run: |
        mkdir -p ~/.m2
        cat > ~/.m2/settings.xml <<EOF
        <settings>
          <mirrors>
            <mirror>
              <id>central-mirror</id>
              <mirrorOf>*</mirrorOf>
              <url>https://repo.maven.apache.org/maven2</url>
            </mirror>
          </mirrors>
          <profiles>
            <profile>
              <id>default</id>
              <repositories>
                <repository>
                  <id>central</id>
                  <url>https://repo.maven.apache.org/maven2</url>
                  <releases><enabled>true</enabled></releases>
                  <snapshots><enabled>false</enabled></snapshots>
                </repository>
              </repositories>
            </profile>
          </profiles>
          <activeProfiles>
            <activeProfile>default</activeProfile>
          </activeProfiles>
        </settings>
        EOF
    
    - name: Build with Maven (force clean download)
      run: mvn clean compile -B -U -Dmaven.repo.local=.m2/repository
    
    - name: Run unit tests
      run: mvn test -B -Dmaven.repo.local=.m2/repository
    
    - name: Generate JaCoCo coverage report
      run: mvn jacoco:report -B -Dmaven.repo.local=.m2/repository
      continue-on-error: true
    
    - name: Archive test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: |
          **/target/surefire-reports/
          **/target/failsafe-reports/
    
    - name: Archive coverage reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: coverage-reports
        path: |
          **/target/site/jacoco/
